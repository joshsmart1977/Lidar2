<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Green Physics Pro - Legacy LiDAR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: white; }
        #uiToggle { position: absolute; top: 10px; left: 10px; z-index: 100; background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        #ui { position: absolute; top: 55px; left: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 12px; z-index: 10; width: 280px; display: none; border: 1px solid #444; }
        #ui.visible { display: block; }
        .slider-group { margin: 12px 0; }
        label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        span.slider-val { float: right; color: #4CAF50; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #28a745; cursor: pointer; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; width: 90%; max-width: 400px; }
        .btn { flex: 1; background: #28a745; color: white; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; }
        #scanOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>
    <div id="scanOverlay">
        <h2 style="color: #00ff00;">LiDAR SCANNING</h2>
        <p id="scanStatus">Point camera at floor and move...</p>
        <p id="pointCount">Points: 0</p>
        <button id="stopScanBtn" class="btn" style="background:#dc3545; max-width: 200px;">FINISH SCAN</button>
    </div>

    <button id="uiToggle">MENU</button>
    <div id="ui">
        <h3 style="margin:0 0 10px 0;">Green Physics Pro</h3>
        <div class="slider-group"><label>Mesh Smooth: <span id="smoothVal" class="slider-val">5</span></label><input type="range" id="smoothSlider" min="1" max="12" value="5"></div>
        <div class="slider-group"><label>Stimp: <span id="stimpVal" class="slider-val">11.0</span></label><input type="range" id="stimpSlider" min="7" max="14" step="0.1" value="11.0"></div>
        <div class="slider-group"><label>Aim Off: <span id="aimVal" class="slider-val">0.0</span>°</label><input type="range" id="aimSlider" min="-30" max="30" step="0.1" value="0.0"></div>
        <div class="slider-group"><label>Pwr: <span id="pwrVal" class="slider-val">3.2</span> m/s</label><input type="range" id="pwrSlider" min="0.5" max="12" step="0.05" value="3.2"></div>
        <div id="results">Waiting for scan...</div>
    </div>

    <div id="controls">
        <button id="liveScanBtn" class="btn" style="background: #6f42c1;">LIVE SCAN</button>
        <label class="btn" style="cursor:pointer;">LOAD .PLY<input type="file" id="fileInput" accept=".ply" style="display:none;"></label>
        <button id="resetBtn" class="btn" style="background:#dc3545; display:none;">RESET</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PLYLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/PLYLoader.js';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse, meshSurface, lastGeo;
        let selectedPoints = [], markers = [], ballPathMesh = null, ghostBall = null, pathData = [];
        let xrSession = null, accumulatedVertices = [];

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            
            ghostBall = new THREE.Mesh(new THREE.SphereGeometry(0.021, 16, 16), new THREE.MeshBasicMaterial({color: 0xffffff}));
            ghostBall.visible = false;
            scene.add(ghostBall);

            window.addEventListener('pointerdown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || document.getElementById('ui').contains(e.target) || !meshSurface) return;
                onPick(e);
            });
            animate();
        }

        // --- LEGACY BRIDGE SCANNING ---
        document.getElementById('liveScanBtn').onclick = async () => {
            if (!navigator.xr) { alert("Use Mozilla XRViewer."); return; }
            accumulatedVertices = [];
            const sessionOptions = { optionalFeatures: ['world-sensing', 'dom-overlay'], domOverlay: { root: document.body } };

            try {
                xrSession = await navigator.xr.requestSession('immersive-ar', sessionOptions);
                document.getElementById('scanOverlay').style.display = 'flex';

                const onFrame = (time, frame) => {
                    if (!xrSession) return;
                    
                    // LEGACY API: Mozilla XRViewer often populates this via worldInformation
                    const meshes = frame.worldInformation?.detectedMeshes || [];
                    if (meshes.length > 0) {
                        meshes.forEach(m => {
                            const v = m.vertices;
                            for(let i=0; i<v.length; i++) accumulatedVertices.push(v[i]);
                        });
                        document.getElementById('pointCount').innerText = `Points: ${Math.floor(accumulatedVertices.length / 3)}`;
                    } else {
                        // FORCE: If no mesh, try to poll the legacy worldMesh directly
                        if (xrSession.getWorldMesh) {
                            const legacyMesh = xrSession.getWorldMesh();
                            if (legacyMesh && legacyMesh.vertices) {
                                for(let i=0; i<legacyMesh.vertices.length; i++) accumulatedVertices.push(legacyMesh.vertices[i]);
                                document.getElementById('pointCount').innerText = `Points: ${Math.floor(accumulatedVertices.length / 3)} (Legacy)`;
                            }
                        }
                    }
                    xrSession.requestAnimationFrame(onFrame);
                };
                xrSession.requestAnimationFrame(onFrame);
            } catch (e) { alert("XR Error: " + e.message); }
        };

        document.getElementById('stopScanBtn').onclick = () => {
            if (accumulatedVertices.length < 9) { alert("Still no data. Try aiming at a wall or rug first."); return; }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(accumulatedVertices, 3));
            exportToPLY(geo);
            xrSession.end();
            document.getElementById('scanOverlay').style.display = 'none';
        };

        function exportToPLY(geometry) {
            const pos = geometry.attributes.position.array;
            let ply = `ply\nformat ascii 1.0\nelement vertex ${pos.length / 3}\nproperty float x\nproperty float y\nproperty float z\nend_header\n`;
            for (let i = 0; i < pos.length; i += 3) ply += `${pos[i]} ${pos[i+1]} ${pos[i+2]}\n`;
            
            const loader = new PLYLoader();
            loader.load(URL.createObjectURL(new Blob([ply], {type:'text/plain'})), (geo) => {
                lastGeo = geo;
                processTerrain();
                document.getElementById('resetBtn').style.display = 'block';
                document.getElementById('results').innerHTML = "Scan Loaded. Select Ball.";
            });
            // Download for GitHub
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ply], {type:'text/plain'})); a.download="scan.ply"; a.click();
        }

        // --- TERRAIN GENERATOR ---
        function processTerrain() {
            if (!lastGeo) return;
            if (meshSurface) scene.remove(meshSurface);
            const pos = lastGeo.attributes.position.array;
            const grid = {}, res = 0.05; 
            for (let i = 0; i < pos.length; i += 3) {
                const x = pos[i], y = pos[i+1], z = pos[i+2];
                if (y < -10 || y > 10) continue; 
                const gx = Math.round(x / res), gz = Math.round(z / res);
                const key = `${gx},${gz}`;
                if (!grid[key]) grid[key] = [];
                grid[key].push(y);
            }
            let heightMap = {};
            for (let key in grid) heightMap[key] = grid[key].sort((a,b)=>a-b)[Math.floor(grid[key].length/2)];
            
            const meshGeo = new THREE.BufferGeometry();
            const verts = [], indices = [], keyToIdx = {};
            let idx = 0;
            for (let key in heightMap) {
                const [gx, gz] = key.split(',').map(Number);
                verts.push(gx * res, heightMap[key], gz * res);
                keyToIdx[key] = idx++;
            }
            for (let key in heightMap) {
                const [gx, gz] = key.split(',').map(Number);
                const k1=`${gx},${gz}`, k2=`${gx+1},${gz}`, k3=`${gx},${gz+1}`, k4=`${gx+1},${gz+1}`;
                if (keyToIdx[k1]!==undefined && keyToIdx[k2]!==undefined && keyToIdx[k3]!==undefined) indices.push(keyToIdx[k1], keyToIdx[k3], keyToIdx[k2]);
                if (keyToIdx[k2]!==undefined && keyToIdx[k3]!==undefined && keyToIdx[k4]!==undefined) indices.push(keyToIdx[k2], keyToIdx[k3], keyToIdx[k4]);
            }
            meshGeo.setIndex(indices);
            meshGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            meshGeo.computeVertexNormals();
            meshSurface = new THREE.Mesh(meshGeo, new THREE.MeshStandardMaterial({ color: 0x28a745, side: THREE.DoubleSide }));
            scene.add(meshSurface);
        }

        function calculatePutt() {
            if (ballPathMesh) scene.remove(ballPathMesh);
            pathData = [];
            const ballStart = selectedPoints[0].clone(), holePos = selectedPoints[1].clone();
            const pwr = parseFloat(document.getElementById('pwrSlider').value), stimp = parseFloat(document.getElementById('stimpSlider').value);
            const aim = parseFloat(document.getElementById('aimSlider').value);
            let vel = new THREE.Vector3().subVectors(holePos, ballStart).setY(0);
            vel.applyAxisAngle(new THREE.Vector3(0, 1, 0), (aim * Math.PI) / 180).normalize().multiplyScalar(pwr);
            const dt = 0.012, mu = (0.131 * 9.81) * (10 / stimp);
            let curPos = ballStart.clone(), curVel = vel.clone();

            for (let i = 0; i < 2000; i++) {
                pathData.push(curPos.clone());
                raycaster.set(curPos.clone().add(new THREE.Vector3(0, 1, 0)), new THREE.Vector3(0, -1, 0));
                const hits = raycaster.intersectObject(meshSurface);
                if (hits.length > 0) {
                    const normal = hits[0].face.normal;
                    let slope = new THREE.Vector3(0, -9.81, 0).projectOnPlane(normal).multiplyScalar(0.7);
                    let friction = curVel.clone().normalize().multiplyScalar(-mu);
                    curVel.add(slope.add(friction).multiplyScalar(dt));
                    curPos.y = hits[0].point.y + 0.021;
                }
                curPos.add(curVel.clone().multiplyScalar(dt));
                if (curVel.length() < 0.05) break;
            }
            const curve = new THREE.CatmullRomCurve3(pathData);
            ballPathMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, pathData.length, 0.01, 8, false), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
            scene.add(ballPathMesh);
            ghostBall.visible = true;
        }

        function onPick(e) {
            if (selectedPoints.length >= 2) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(meshSurface);
            if (hits.length > 0) {
                const p = hits[0].point; selectedPoints.push(p);
                const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: selectedPoints.length===1?0xffffff:0xff0000}));
                dot.position.copy(p); scene.add(dot); markers.push(dot);
                if (selectedPoints.length === 2) calculatePutt();
            }
        }

        ['smoothSlider', 'stimpSlider', 'pwrSlider', 'aimSlider'].forEach(id => {
            document.getElementById(id).oninput = (e) => {
                document.getElementById(id.replace('Slider', 'Val')).innerText = e.target.value;
                if (id === 'smoothSlider' && lastGeo) processTerrain();
                if (selectedPoints.length === 2) calculatePutt();
            };
        });

        document.getElementById('uiToggle').onclick = () => document.getElementById('ui').classList.toggle('visible');
        document.getElementById('resetBtn').onclick = () => {
            selectedPoints = []; markers.forEach(m => scene.remove(m)); markers = [];
            if(ballPathMesh) scene.remove(ballPathMesh); ghostBall.visible = false;
        };

        function animate() {
            requestAnimationFrame(animate);
            if (ghostBall.visible && pathData.length > 0) {
                ghostBall.position.copy(pathData[(Math.floor(Date.now() / 20)) % pathData.length]);
            }
            controls.update(); renderer.render(scene, camera);
        }
    </script>
</body>
</html>
