<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Green Physics Pro - Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: -apple-system, sans-serif; color: white; }
        #uiToggle { position: absolute; top: 10px; left: 10px; z-index: 100; background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #ui { position: absolute; top: 55px; left: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 12px; z-index: 10; width: 260px; display: none; border: 1px solid #444; }
        #ui.visible { display: block; }
        .slider-group { margin: 10px 0; font-size: 12px; }
        input[type="range"] { width: 100%; accent-color: #28a745; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; width: 90%; }
        .btn { flex: 1; background: #28a745; color: white; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #statusLog { font-size: 12px; color: #ffcc00; margin-bottom: 5px; text-align: center; }
    </style>
</head>
<body>
    <button id="uiToggle">MENU</button>
    <div id="ui">
        <div id="statusLog">Status: Standby</div>
        <div class="slider-group"><label>Stimp: <span id="stimpVal">11.0</span></label><input type="range" id="stimpSlider" min="7" max="14" step="0.1" value="11.0"></div>
        <div class="slider-group"><label>Power: <span id="pwrVal">3.2</span></label><input type="range" id="pwrSlider" min="0.5" max="12" step="0.1" value="3.2"></div>
        <div class="slider-group"><label>Aim: <span id="aimVal">0.0</span>°</label><input type="range" id="aimSlider" min="-30" max="30" step="0.1" value="0.0"></div>
    </div>
    <div id="controls">
        <button id="scanBtn" class="btn">START SCAN</button>
        <button id="resetBtn" class="btn" style="background:#444;">RELOAD</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { ARButton } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/webxr/ARButton.js';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        let scene, camera, renderer, controls, meshSurface;
        let scanning = false, lidarPoints = [], hitTestSource = null, hitTestSourceRequested = false;
        let selectedPoints = [], markers = [], ballPathMesh = null;

        const statusLog = document.getElementById('statusLog');
        const scanBtn = document.getElementById('scanBtn');

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222)); // Add grid so we know where center is

            const arBtn = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            arBtn.style.display = 'none';
            document.body.appendChild(arBtn);

            scanBtn.onclick = () => {
                if (!renderer.xr.isPresenting) {
                    lidarPoints = [];
                    arBtn.click();
                } else {
                    stopScan();
                }
            };

            document.getElementById('resetBtn').onclick = () => location.reload();
            document.getElementById('uiToggle').onclick = () => document.getElementById('ui').classList.toggle('visible');

            renderer.xr.addEventListener('sessionstart', () => {
                scanning = true;
                scanBtn.innerText = "STOP & BUILD";
                statusLog.innerText = "Status: Point at floor & move";
            });

            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame && scanning) {
                const session = frame.session;
                const refSpace = renderer.xr.getReferenceSpace();
                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then(s => {
                        session.requestHitTestSource({ space: s }).then(src => hitTestSource = src);
                    });
                    hitTestSourceRequested = true;
                }
                if (hitTestSource) {
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length > 0) {
                        const pose = results[0].getPose(refSpace);
                        lidarPoints.push(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                        statusLog.innerText = `Points: ${Math.floor(lidarPoints.length/3)}`;
                    }
                }
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function stopScan() {
            scanning = false;
            renderer.xr.getSession().end();
            scanBtn.innerText = "START SCAN";
            buildMesh();
        }

        function buildMesh() {
            if (lidarPoints.length < 15) {
                statusLog.innerText = "Error: Too few points!";
                return;
            }

            if (meshSurface) scene.remove(meshSurface);
            const res = 0.15; // Rougher grid to ensure connection
            const grid = {};

            for (let i = 0; i < lidarPoints.length; i += 3) {
                const gx = Math.round(lidarPoints[i] / res), gz = Math.round(lidarPoints[i+2] / res);
                const key = `${gx},${gz}`;
                if (!grid[key]) grid[key] = [];
                grid[key].push(lidarPoints[i+1]);
            }

            const meshGeo = new THREE.BufferGeometry();
            const verts = [], indices = [], keyToIdx = {};
            let idx = 0;

            for (let key in grid) {
                const [gx, gz] = key.split(',').map(Number);
                const avgY = grid[key].reduce((a, b) => a + b, 0) / grid[key].length;
                verts.push(gx * res, avgY, gz * res);
                keyToIdx[key] = idx++;
            }

            for (let key in keyToIdx) {
                const [gx, gz] = key.split(',').map(Number);
                const k1 = `${gx},${gz}`, k2 = `${gx+1},${gz}`, k3 = `${gx},${gz+1}`, k4 = `${gx+1},${gz+1}`;
                if (keyToIdx[k1]!==undefined && keyToIdx[k2]!==undefined && keyToIdx[k3]!==undefined) indices.push(keyToIdx[k1], keyToIdx[k3], keyToIdx[k2]);
                if (keyToIdx[k2]!==undefined && keyToIdx[k3]!==undefined && keyToIdx[k4]!==undefined) indices.push(keyToIdx[k2], keyToIdx[k3], keyToIdx[k4]);
            }

            meshGeo.setIndex(indices);
            meshGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
            meshGeo.computeVertexNormals();
            meshSurface = new THREE.Mesh(meshGeo, new THREE.MeshStandardMaterial({ color: 0x28a745, side: THREE.DoubleSide }));
            scene.add(meshSurface);

            // FORCE VIEW RESET: Move camera to look at the mesh
            const box = new THREE.Box3().setFromObject(meshSurface);
            const center = box.getCenter(new THREE.Vector3());
            controls.target.copy(center);
            camera.position.set(center.x, center.y + 3, center.z + 5);
            statusLog.innerText = "Built! Tap floor to set ball.";
        }
    </script>
</body>
</html>
