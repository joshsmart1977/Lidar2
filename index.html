<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exponential Momentum Tracker</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0d0d0d; color: #00ff41; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #000; padding: 30px; border: 2px solid #00ff41; border-radius: 5px; width: 500px; text-align: center; box-shadow: 0 0 20px #00ff41; }
        .display { display: flex; justify-content: space-around; margin: 25px 0; border: 1px solid #00ff41; padding: 15px; }
        .val { font-size: 2.5rem; font-weight: bold; display: block; }
        .label { font-size: 0.8rem; color: #00ff41; text-decoration: underline; }
        .controls { display: flex; gap: 15px; justify-content: center; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 12px 25px; font-size: 1rem; cursor: pointer; transition: 0.1s; }
        button:hover { background: #00ff41; color: #000; }
        .stats { margin-top: 20px; font-size: 0.9rem; text-align: left; line-height: 1.6; }
        .change { color: #fff; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>EXP-MOMENTUM v2.0</h2>
    
    <div class="display">
        <div>
            <span class="label">LOWER BOUND</span>
            <span id="lower" class="val">0.000</span>
        </div>
        <div>
            <span class="label">UPPER BOUND</span>
            <span id="upper" class="val">100.000</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="flip('H')">FLIP HEADS</button>
        <button onclick="flip('T')">FLIP TAILS</button>
    </div>

    <div class="stats">
        Current Streak: <span id="streak">0</span><br>
        Last Change (L): <span id="changeL" class="change">0</span><br>
        Last Change (U): <span id="changeU" class="change">0</span><br>
        History: <span id="seq">-</span>
    </div>
    <br>
    <button style="border:none; text-decoration:underline;" onclick="reset()">RESET SYSTEM</button>
</div>

<script>
    let lower = 0;
    let upper = 100;
    let streakCount = 0;
    let lastResult = null;
    let history = "";

    function flip(result) {
        if (result === lastResult) {
            streakCount++;
        } else {
            streakCount = 1;
        }
        lastResult = result;
        history += result;

        let strongMove = 0.5 * Math.pow(2, streakCount - 1);
        let weakMove = 0.5 * Math.pow(0.5, streakCount);

        let deltaL = 0;
        let deltaU = 0;

        if (result === 'H') {
            deltaL = strongMove;
            deltaU = weakMove;
            lower += deltaL;
            upper += deltaU;
        } else {
            deltaL = -weakMove;
            deltaU = -strongMove;
            lower += deltaL;
            upper += deltaU;
        }

        // Clamp 0-100
        lower = Math.max(0, Math.min(100, lower));
        upper = Math.max(0, Math.min(100, upper));
        
        // Prevent collision
        if (lower >= upper) {
            if (result === 'H') upper = Math.min(100, lower + 0.001);
            else lower = Math.max(0, upper - 0.001);
        }

        document.getElementById('changeL').innerText = (deltaL > 0 ? "+" : "") + deltaL.toFixed(4);
        document.getElementById('changeU').innerText = (deltaU > 0 ? "+" : "") + deltaU.toFixed(4);
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('lower').innerText = lower.toFixed(3);
        document.getElementById('upper').innerText = upper.toFixed(3);
        document.getElementById('streak').innerText = streakCount + (lastResult || "");
        document.getElementById('seq').innerText = history.slice(-20);
    }

    function reset() {
        lower = 0; upper = 100; streakCount = 0; lastResult = null; history = "";
        updateDisplay();
        document.getElementById('changeL').innerText = "0";
        document.getElementById('changeU').innerText = "0";
    }
</script>

</body>
</html>
